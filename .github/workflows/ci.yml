name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # `prepare` runs the build on install, so this also verifies that a
      # consumer installing the package straight from git gets working output.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build widget
        run: npm run build:widget

      # Project hard gate — a dependency advisory blocks the build.
      - name: Audit (published dependencies)
        run: npm audit --omit=dev --audit-level=low
      # Dev tooling: reported, not blocking — an advisory with no patched
      # release (picomatch GHSA-fc5q-39xc-vjpf) must not stop every build.
      - name: Audit (dev tooling — reported)
        run: npm audit --audit-level=low
        continue-on-error: true
